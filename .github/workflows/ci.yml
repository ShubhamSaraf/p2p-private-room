name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test protocol
        run: npm run test --workspace @peerlink/protocol
      - name: Test crypto
        run: npm run test --workspace @peerlink/crypto
      - name: Test transfer
        run: npm run test --workspace @peerlink/transfer
      - name: Test web history
        run: npm exec --workspace @peerlink/web -- vitest run src/localHistory.test.ts --reporter=default --reporter=github-actions
      - name: Test web application
        run: npm exec --workspace @peerlink/web -- vitest run src/App.test.tsx --reporter=default --reporter=github-actions
      - name: Test signaling
        run: npm run test --workspace @peerlink/signaling
      - name: Build workspaces
        run: npm run build
      - name: Check bundle budgets
        run: npm run check:bundle
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Run browser tests
        run: npm run test:e2e
