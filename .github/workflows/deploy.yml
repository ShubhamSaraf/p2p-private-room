name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run check:phase18
      - run: npm run deploy --workspace @peerlink/signaling
      - run: npm run build --workspace @peerlink/web
        env:
          VITE_SIGNALING_URL: https://peerlink-signaling.shubhamsaraf.workers.dev
      - run: npx wrangler pages deploy apps/web/dist --project-name peerlink --branch main
